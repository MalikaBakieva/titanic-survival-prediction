<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Admin Kirish — Titanic Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-box {
            max-width: 420px;
            margin: 100px auto;
            padding: 36px 30px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .login-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .login-title {
            font-size: 1.6rem;
            color: #f1f5f9;
            margin-bottom: 8px;
            font-family: 'Playfair Display', serif;
        }
        .login-desc {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 18px;
            box-sizing: border-box;
        }
        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            color: #fff;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.88rem;
            margin-bottom: 16px;
        }
        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.88rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-icon">🔐</div>
        <h2 class="login-title">Admin Xavfsizlik / Security</h2>
        <p class="login-desc">Statistika va to'plangan dataset faqat loyiha egasiga ko'rinadi.<br><span style="font-size:0.82rem; color:#64748b;">Analytics and collected datasets are restricted to the owner.</span></p>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin-login">
            <input type="password" name="password" class="form-control" placeholder="Admin maxfiy paroli / Admin password" required autofocus>
            <button type="submit" class="btn-submit">Tizimga Kirish / Login</button>
        </form>

        <a href="/" class="back-link">← Bosh sahifaga qaytish / Back to Home</a>
    </div>
</body>
</html>
